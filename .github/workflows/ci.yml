name: ci

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: i18n parity (packages/lib single source)
        run: bun run --cwd apps/web check:i18n
      - name: typecheck (includes tokens.css light/dark parity on @app/mobile)
        run: bun run typecheck
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: regenerate ARCHITECTURE.md (§6.3)
        run: bun run docs:gen
      - name: fail on drift (routes/schema/API not regenerated)
        run: git diff --exit-code docs/ARCHITECTURE.md
