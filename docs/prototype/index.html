<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firecent prototype</title>
    <link rel="icon" href="assets/brand/favicon.svg" />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body class="h-dvh overflow-hidden bg-[#e9ecf2] text-foreground">
    <div class="flex h-full">
      <!-- Screens -->
      <aside class="flex w-60 shrink-0 flex-col border-r bg-card max-md:hidden">
        <div class="px-5 pt-5 pb-4">
          <img src="assets/brand/logo.svg" alt="Firecent" class="h-7 w-auto" />
          <p class="mt-2 text-[13px] text-muted-foreground">UI prototype, mobile first</p>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 pb-4" aria-label="Screens">
          <ul id="screens" class="space-y-0.5"></ul>
          <p id="pending-title" class="mt-5 px-2 text-[12px] font-medium text-muted-foreground">Not built yet</p>
          <ul id="pending" class="mt-1.5 space-y-0.5"></ul>
        </nav>
        <a href="SPEC.md" class="mx-3 mb-1 flex h-10 items-center gap-2 rounded-lg px-2 text-[14px] text-muted-foreground hover:bg-accent hover:text-foreground">
          <i data-icon="file-text" class="size-4"></i>SPEC.md
        </a>
        <a href="design-notes.md" class="mx-3 mb-4 flex h-10 items-center gap-2 rounded-lg px-2 text-[14px] text-muted-foreground hover:bg-accent hover:text-foreground">
          <i data-icon="file-text" class="size-4"></i>design-notes.md
        </a>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <!-- Toggles -->
        <header class="flex flex-wrap items-center gap-x-5 gap-y-2 border-b bg-card px-5 py-2.5">
          <h1 id="title" class="mr-auto text-[15px] font-semibold">Home</h1>

          <div class="flex items-center gap-2" role="group" aria-label="Device">
            <span class="text-[13px] text-muted-foreground">Device</span>
            <div class="flex rounded-lg bg-muted p-0.5" data-group="device">
              <button type="button" data-value="mobile" class="seg"><i data-icon="smartphone" class="size-4"></i>Mobile</button>
              <button type="button" data-value="desktop" class="seg"><i data-icon="monitor" class="size-4"></i>Desktop</button>
            </div>
          </div>

          <div class="flex items-center gap-2" role="group" aria-label="Theme">
            <span class="text-[13px] text-muted-foreground">Theme</span>
            <div class="flex rounded-lg bg-muted p-0.5" data-group="theme">
              <button type="button" data-value="light" class="seg"><i data-icon="sun" class="size-4"></i>Light</button>
              <button type="button" data-value="dark" class="seg"><i data-icon="moon" class="size-4"></i>Dark</button>
              <button type="button" data-value="both" class="seg">Both</button>
            </div>
          </div>

          <div class="flex items-center gap-2" role="group" aria-label="State">
            <span class="text-[13px] text-muted-foreground">State</span>
            <div class="flex rounded-lg bg-muted p-0.5" data-group="state">
              <button type="button" data-value="data" class="seg">With data</button>
              <button type="button" data-value="empty" class="seg">Empty</button>
              <button type="button" data-value="loading" class="seg">Loading</button>
              <button type="button" data-value="error" class="seg">Error</button>
            </div>
          </div>

          <div id="sheet-group" class="flex items-center gap-2" role="group" aria-label="Sheet">
            <span class="text-[13px] text-muted-foreground">Sheet</span>
            <div class="flex flex-wrap rounded-lg bg-muted p-0.5" data-group="sheet"></div>
          </div>
        </header>

        <!-- Canvas -->
        <main class="min-h-0 flex-1 overflow-auto p-6"><div id="canvas" class="mx-auto flex w-max items-start gap-10"></div></main>
      </div>
    </div>

    <style>
      .seg {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        height: 2rem;
        padding: 0 0.75rem;
        border-radius: 0.375rem;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-foreground);
      }
      .seg[aria-pressed="true"] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgb(11 18 32 / 0.12);
      }
      .seg:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>

    <script>
      // Sheets every screen has (they live in assets/proto.js). Filled in as they are built.
      var SHARED_SHEETS = ["add", "space", "ask"];
      // One entry per screen. `file` may carry its own query (?id=, ?view=, ?step=).
      var SCREENS = [
        { id: "home", label: "Home", icon: "house", file: "home.html", sheets: [] },
        { id: "transactions", label: "Transactions", icon: "arrow-left-right", file: "transactions.html", sheets: ["filters", "detail"] },
        { id: "accounts", label: "Accounts", icon: "wallet", file: "accounts.html", sheets: ["add-account"] },
        { id: "account", label: "Account (Checking)", icon: "landmark", file: "account.html?id=1", sheets: ["share"] },
        { id: "account-card", label: "Account (Card)", icon: "credit-card", file: "account.html?id=3", sheets: ["pay-card", "plan", "share"] },
        { id: "budget", label: "Budget", icon: "target", file: "budget.html", sheets: ["edit-plan", "limit"] },
        { id: "analytics", label: "Analytics", icon: "chart-column", file: "analytics.html", sheets: [] },
        { id: "recurring", label: "Recurring", icon: "repeat", file: "recurring.html", sheets: ["detail", "confirm", "auto", "add-recurring"] },
        { id: "debts", label: "Debts", icon: "hand-coins", file: "debts.html", sheets: ["detail", "pay-debt", "add-debt"] },
        { id: "assistant", label: "Assistant", icon: "firecent-mono", file: "assistant.html?view=thread", sheets: ["threads"] },
        { id: "assistant-new", label: "Assistant (New)", icon: "sparkles", file: "assistant.html?view=new", sheets: ["threads"] },
        { id: "more", label: "More / Settings", icon: "layout-grid", file: "more.html", sheets: [] },
        { id: "categories", label: "Categories & labels", icon: "tags", file: "categories.html", sheets: ["edit-category", "add-category"] },
        { id: "members", label: "Members & sharing", icon: "users", file: "members.html", sheets: ["invite"] },
        { id: "notifications", label: "Notifications", icon: "bell", file: "notifications.html", sheets: [] },
        { id: "onboarding", label: "Onboarding", icon: "compass", file: "onboarding.html?step=1", sheets: [] },
      ];
      var PENDING = [];
      var ui = { screen: "home", device: "mobile", theme: "both", state: "data", sheet: "" };

      document.getElementById("screens").innerHTML = SCREENS.map(function (s) {
        return '<li><button type="button" data-screen="' + s.id + '" class="flex h-10 w-full items-center gap-2.5 rounded-lg px-2 text-left text-[14px] font-medium aria-[current=page]:bg-accent"><i data-icon="' + s.icon + '" class="size-4"></i>' + s.label + "</button></li>";
      }).join("");
      document.getElementById("pending").innerHTML = PENDING.map(function (p) {
        return '<li class="flex h-9 items-center px-2 text-[14px] text-muted-foreground">' + p + "</li>";
      }).join("");
      document.getElementById("pending-title").hidden = !PENDING.length;

      function src(screen, theme) {
        var q = "theme=" + theme + "&state=" + ui.state + (ui.sheet ? "&sheet=" + ui.sheet : "");
        return screen.file + (screen.file.indexOf("?") < 0 ? "?" : "&") + q;
      }

      function phone(theme, screen) {
        var label = theme === "dark" ? "Dark" : "Light";
        return (
          '<figure class="' + theme + ' shrink-0">' +
          '<div class="rounded-[56px] bg-[#0b1220] p-[10px] shadow-[0_30px_60px_-20px_rgb(11_18_32/0.45)]">' +
          '<div class="relative h-[844px] w-[390px] overflow-hidden rounded-[46px] bg-background text-foreground ring-1 ring-white/10">' +
          '<div class="flex h-[50px] items-end justify-between px-9 pb-1.5 text-[15px] font-semibold"><span class="num">9:41</span>' +
          '<span class="flex items-center gap-1.5"><i data-icon="signal" class="size-4"></i><i data-icon="wifi" class="size-4"></i><i data-icon="battery-full" class="size-5"></i></span></div>' +
          '<div class="absolute top-[11px] left-1/2 h-[32px] w-[112px] -translate-x-1/2 rounded-full bg-black"></div>' +
          '<iframe class="block h-[794px] w-full border-0" title="' + label + ' theme" src="' + src(screen, theme) + '"></iframe>' +
          '<div class="pointer-events-none absolute bottom-2 left-1/2 h-[5px] w-[134px] -translate-x-1/2 rounded-full bg-foreground/85"></div>' +
          "</div></div>" +
          '<figcaption class="mt-3 text-center text-[13px] text-[#566275]">' + label + "</figcaption>" +
          "</figure>"
        );
      }

      // Desktop: a 1440 × 900 browser window, scaled with the same fit as the phones.
      function desktop(theme, screen) {
        var label = theme === "dark" ? "Dark" : "Light";
        return (
          '<figure class="' + theme + ' shrink-0">' +
          '<div class="overflow-hidden rounded-[14px] bg-[#0b1220] p-[6px] shadow-[0_30px_60px_-20px_rgb(11_18_32/0.45)]">' +
          '<div class="flex h-[26px] items-center gap-1.5 px-2"><span class="size-2.5 rounded-full bg-white/25"></span><span class="size-2.5 rounded-full bg-white/25"></span><span class="size-2.5 rounded-full bg-white/25"></span></div>' +
          '<iframe class="block h-[900px] w-[1440px] rounded-[8px] border-0 bg-background" title="' + label + ' theme" src="' + src(screen, theme) + '"></iframe>' +
          "</div>" +
          '<figcaption class="mt-3 text-center text-[13px] text-[#566275]">' + label + "</figcaption>" +
          "</figure>"
        );
      }

      function render() {
        var screen = SCREENS.find(function (s) { return s.id === ui.screen; });
        var sheets = (screen.sheets || []).concat(SHARED_SHEETS);
        if (sheets.indexOf(ui.sheet) < 0) ui.sheet = "";
        document.getElementById("title").textContent = screen.label;
        var group = document.querySelector('[data-group="sheet"]');
        group.innerHTML = ['<button type="button" data-value="" class="seg">None</button>'].concat(sheets.map(function (s) {
          return '<button type="button" data-value="' + s + '" class="seg">' + s + "</button>";
        })).join("");
        document.getElementById("sheet-group").hidden = !sheets.length;

        var themes = ui.theme === "both" ? ["light", "dark"] : [ui.theme];
        var canvas = document.getElementById("canvas");
        canvas.innerHTML = themes.map(function (t) { return ui.device === "desktop" ? desktop(t, screen) : phone(t, screen); }).join("");
        window.fableIcons(canvas);
        fit();
        document.querySelectorAll("[data-group]").forEach(function (g) {
          g.querySelectorAll("button").forEach(function (b) {
            b.setAttribute("aria-pressed", String(ui[g.dataset.group] === b.dataset.value));
          });
        });
        document.querySelectorAll("[data-screen]").forEach(function (b) {
          if (b.dataset.screen === ui.screen) b.setAttribute("aria-current", "page");
          else b.removeAttribute("aria-current");
        });
      }

      // Shrink the frames when the window is shorter than a frame plus its chrome.
      function fit() {
        var canvas = document.getElementById("canvas");
        var main = canvas.parentElement;
        var figs = canvas.querySelectorAll("figure");
        var z;
        if (ui.device === "desktop") {
          var zh = (main.clientHeight - 48 - 32) / (900 + 38);
          var zw = (main.clientWidth - 48 - 40 * (figs.length - 1)) / (1452 * figs.length);
          z = Math.max(0.3, Math.min(1, zh, zw));
        } else {
          z = Math.max(0.5, Math.min(1, (main.clientHeight - 48 - 32) / 864));
        }
        figs.forEach(function (f) { f.style.zoom = z; });
      }

      document.addEventListener("click", function (e) {
        var b = e.target.closest("[data-group] button, [data-screen]");
        if (!b || b.disabled) return;
        if (b.dataset.screen) { ui.screen = b.dataset.screen; ui.sheet = ""; }
        else ui[b.parentElement.dataset.group] = b.dataset.value;
        render();
      });
      window.addEventListener("resize", fit);
    </script>
    <script src="assets/icons.js"></script>
    <script>
      render();
    </script>
  </body>
</html>
