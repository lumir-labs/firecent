      </g>
    </g>
  </g>
</svg>

<canvas id="fx"></canvas>
<div class="vignette"></div>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const svg = $('stage'), canvas = $('fx'), ctx = canvas.getContext('2d');
  const flameWrap = $('flameWrap'), flickerMap = $('flickerMap'), spot = $('spot');
  const layers = { glowA: $('pxGlowA'), glowB: $('pxGlowB'), waves: $('pxWaves'), logo: $('pxLogo') };

  /* ---------- Layout responsivo: viewBox que siempre muestra el logo ---------- */
  let DPR = 1, VB = { x: 0, y: 0, w: 1920, h: 1080 }, BR = { x: 0, y: 0 };
  function layout() {
    const a = innerWidth / innerHeight;
    let W, H;
    if (a >= 16 / 9) { W = 1920; H = W / a; }
    else { H = 1080; W = H * a; if (W < 820) { W = 820; H = W / a; } }
    const x = 960 - W / 2, y = 540 - H / 2;
    VB = { x, y, w: W, h: H };
    svg.setAttribute('viewBox', `${x} ${y} ${W} ${H}`);
    $('anchorTL').setAttribute('transform', `translate(${x} ${y})`);
    BR = { x: x + W - 1920, y: y + H - 1080 };
    const br = `translate(${BR.x} ${BR.y})`;
    $('anchorBR1').setAttribute('transform', br);
    $('anchorBR2').setAttribute('transform', br);

    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth * DPR;
    canvas.height = innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', layout);
  layout();

  // Coordenadas SVG (de un elemento) -> pantalla
  const pt = svg.createSVGPoint();
  function toScreen(x, y, el = svg) {
    pt.x = x; pt.y = y;
    const p = pt.matrixTransform(el.getScreenCTM());
    return { x: p.x, y: p.y };
  }
  function toSvg(x, y) {
    pt.x = x; pt.y = y;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: p.x, y: p.y };
  }

  /* ---------- Olas vivas ---------- */
  // pts: puntos de la curva bezier original; grp: ancla a la que pertenece cada punto
  const waves = [
    { el: $('wave1'), amp: 20, spd: 0.55, ph: 0.0,
      pts: [[1180,1100],[1379.045,1075],[1487.615,937.5],[1650.47,875],[1777.135,825],[1867.61,806.25],[1939.99,750]],
      grp: [0,0,1,1,1,2,2] },
    { el: $('wave2'), amp: 16, spd: 0.7, ph: 1.7,
      pts: [[1270.475,1100],[1451.425,1070],[1559.995,975],[1704.755,945],[1804.277,925],[1885.705,912.5],[1939.99,875]],
      grp: [0,0,1,1,1,2,2] },
    { el: $('wave3'), amp: 11, spd: 0.9, ph: 3.1,
      pts: [[1415.235,1100],[1578.09,1070],[1722.85,1035],[1939.99,1007.5]],
      grp: [0,0,1,1] }
  ];
  let waveBoost = 0;
  function drawWaves(t, intro) {
    const lift = (1 - intro) * 480;
    for (const w of waves) {
      const anchors = w.pts.filter((_, i) => i % 3 === 0);
      const off = anchors.map((a, i) => i === 0 ? 0 :
        w.amp * (1 + waveBoost * 2.2) * (Math.sin(t * w.spd + w.ph + a[0] * 0.004) + 0.4 * Math.sin(t * w.spd * 1.9 + i)));
      const p = w.pts.map(([x, y], i) => [x, y + off[w.grp[i]] + lift]);
      let d = `M${p[0][0]} ${p[0][1]}`;
      for (let i = 1; i < p.length; i += 3)
        d += ` C${p[i][0]} ${p[i][1]} ${p[i+1][0]} ${p[i+1][1]} ${p[i+2][0]} ${p[i+2][1]}`;
      const last = p[p.length - 1];
      d += ` L2100 ${last[1] - 40} L2100 1400 L${p[0][0] - 50} 1400 Z`;
      w.el.setAttribute('d', d);
    }
  }

  /* ---------- Partículas (brasas) ---------- */
  const COLORS = ['#ffa64f', '#ff7a3d', '#ff3f3a', '#9a88fb', '#7c5cff', '#e9e3ff'];
  const sprites = COLORS.map(c => {
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, '#fff'); gr.addColorStop(0.15, c); gr.addColorStop(0.45, c + '55'); gr.addColorStop(1, c + '00');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return s;
  });
  const parts = [], rings = [];
  const MAX = 700;
  function spawn(x, y, o = {}) {
    if (parts.length > MAX) return;
    const a = o.angle ?? Math.random() * Math.PI * 2, s = o.speed ?? Math.random();
    parts.push({
      x, y, vx: Math.cos(a) * s + (o.vx || 0), vy: Math.sin(a) * s + (o.vy || 0),
      life: 0, max: o.max ?? 80 + Math.random() * 120,
      size: o.size ?? 4 + Math.random() * 10,
      c: o.c ?? (Math.random() * COLORS.length | 0),
      buoy: o.buoy ?? 0.015 + Math.random() * 0.02,
      seed: Math.random() * 100
    });
  }
  function burst(x, y, n = 70, power = 7) {
    for (let i = 0; i < n; i++)
      spawn(x, y, { speed: 1 + Math.random() * power, size: 6 + Math.random() * 14, max: 60 + Math.random() * 90 });
    rings.push({ x, y, r: 0, life: 1 });
  }

  /* ---------- Interacción ---------- */
  const mouse = { x: innerWidth / 2, y: innerHeight / 2, nx: 0, ny: 0, sx: 0, sy: 0, active: false, last: null };
  let hover = false, flicker = 3, spotOp = 0;

  addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    mouse.nx = (e.clientX / innerWidth) * 2 - 1;
    mouse.ny = (e.clientY / innerHeight) * 2 - 1;
    if (!reduced && mouse.last) {
      const dx = e.clientX - mouse.last.x, dy = e.clientY - mouse.last.y;
      const dist = Math.hypot(dx, dy);
      for (let i = 0; i < Math.min(dist / 14, 4); i++)
        spawn(e.clientX, e.clientY, { speed: 0.4, vx: dx * 0.03, vy: dy * 0.03, size: 3 + Math.random() * 6, max: 40 + Math.random() * 40 });
    }
    mouse.last = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerleave', () => { mouse.active = false; mouse.last = null; });
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) { mouse.active = false; mouse.last = null; } });

  flameWrap.addEventListener('pointerenter', () => { hover = true; flameWrap.classList.add('hover'); });
  flameWrap.addEventListener('pointerleave', () => { hover = false; flameWrap.classList.remove('hover'); });

  addEventListener('pointerdown', e => {
    const onFlame = flameWrap.contains(e.target);
    burst(e.clientX, e.clientY, onFlame ? 140 : 70, onFlame ? 10 : 7);
    waveBoost = Math.min(waveBoost + (onFlame ? 1.2 : 0.7), 1.6);
    if (onFlame) {
      flameWrap.classList.remove('flare'); void flameWrap.getBBox(); flameWrap.classList.add('flare');
      setTimeout(() => flameWrap.classList.remove('flare'), 750);
    }
  });

  // Teclas: R = repetir intro, F = pantalla completa
  let introStart = performance.now();
  function replay() {
    document.body.classList.remove('play');
    void document.body.offsetWidth;
    document.body.classList.add('play');
    introStart = performance.now();
  }
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') replay();
    if (e.key === 'f' || e.key === 'F') {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    }
  });

  /* ---------- Loop ---------- */
  const easeOut = x => 1 - Math.pow(1 - x, 4);
  function frame(now) {
    const t = now / 1000;
    const since = now - introStart;
    const intro = reduced ? 1 : easeOut(Math.min(Math.max((since - 400) / 2200, 0), 1));

    // Parallax suavizado
    mouse.sx += (mouse.nx - mouse.sx) * 0.05;
    mouse.sy += (mouse.ny - mouse.sy) * 0.05;
    const P = (el, k) => el.setAttribute('transform', `translate(${(mouse.sx * k).toFixed(2)} ${(mouse.sy * k).toFixed(2)})`);
    P(layers.glowA, -60); P(layers.glowB, 50); P(layers.waves, 28); P(layers.logo, -14);

    // Luz del cursor
    spotOp += ((mouse.active ? 1 : 0) - spotOp) * 0.05;
    const sp = toSvg(mouse.x, mouse.y);
    spot.setAttribute('cx', sp.x); spot.setAttribute('cy', sp.y); spot.setAttribute('opacity', spotOp.toFixed(3));

    // Olas
    waveBoost *= 0.975;
    drawWaves(reduced ? 0 : t, intro);

    // Parpadeo de la flama
    const targetFlicker = reduced ? 0 : (hover ? 9 : 3) + waveBoost * 6;
    flicker += (targetFlicker - flicker) * 0.08;
    flickerMap.setAttribute('scale', flicker.toFixed(2));

    // Emisión ambiental
    if (!reduced && since > 1500) {
      // brasas desde las olas
      if (Math.random() < 0.35) {
        const wx = 1250 + Math.random() * 700, wy = 930 + Math.random() * 150;
        const s = toScreen(wx + BR.x + mouse.sx * 28, wy + BR.y + mouse.sy * 28);
        spawn(s.x, s.y, { angle: -Math.PI / 2 - 0.3 + Math.random() * 0.2, speed: 0.3 + Math.random() * 0.6, size: 3 + Math.random() * 7, max: 160 + Math.random() * 160, buoy: 0.006 });
      }
      // chispas desde la punta de la flama
      if (Math.random() < (hover ? 0.6 : 0.08)) {
        const tip = Math.random() < 0.6 ? [770, 410] : [758, 505];
        const s = toScreen(tip[0] + (Math.random() - .5) * 12, tip[1], layers.logo);
        spawn(s.x, s.y, { angle: -Math.PI / 2 + (Math.random() - .5) * 0.8, speed: 0.6 + Math.random() * (hover ? 2.2 : 1), size: 3 + Math.random() * 7, c: Math.random() < 0.75 ? (Math.random() * 3 | 0) : 3, max: 60 + Math.random() * 80 });
      }
    }

    // Dibujar partículas
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life++;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.vx += Math.sin(now * 0.002 + p.seed) * 0.02;
      p.vy -= p.buoy;
      p.vx *= 0.97; p.vy *= 0.97;
      p.x += p.vx; p.y += p.vy;
      const k = p.life / p.max;
      const alpha = Math.min(1, p.life / 8) * (1 - k);
      const size = p.size * (1 - k * 0.6);
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprites[p.c], p.x - size, p.y - size, size * 2, size * 2);
    }
    // Ondas expansivas
    ctx.globalCompositeOperation = 'source-over';
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += (220 - r.r) * 0.08; r.life -= 0.022;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      ctx.globalAlpha = r.life * 0.6;
      ctx.strokeStyle = '#ff7a3d'; ctx.lineWidth = 2 * r.life + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = r.life * 0.35;
      ctx.strokeStyle = '#9a88fb';
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.7, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  document.body.classList.add('play');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
